; PlatformIO - Ecowitt Display Kiosk (XE1E)
; Board: Waveshare ESP32-S3-Touch-LCD-7B (16MB Flash, 8MB PSRAM OPI)
;
; Enfoque "display tonto": el servidor renderiza el JPEG 1024x600 y el ESP32
; solo lo baja, lo decodifica (JPEGDEC) y lo pinta con doble framebuffer via
; el driver RGB nativo de esp_lcd (incluido en el core arduino-esp32). SIN LVGL.

[env:esp32s3]
; Fork pioarduino: arduino-esp32 3.x (IDF 5.x). Necesario para la API de doble
; framebuffer del panel RGB (esp_lcd_rgb_panel_get_frame_buffer, num_fbs=2);
; el platform oficial se quedo en arduino-esp32 2.0.17 (IDF 4.4) y no la tiene.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Flash 16MB + PSRAM OPI 8MB (Waveshare)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    ; JPEGDEC con el SIMD del S3 activado: su assembly incluye un header de esp-dsp
    ; que no existe para esp32s3, y el stub de stubs/ lo suple habilitando el cuerpo
    ; del .S. Medido en la placa con la misma pagina (A/B por OTA), decode de
    ; 1024x600: 240 ms en C puro -> 148 ms con SIMD (-38%). Es la mitad del tiempo
    ; que duraba el spinner al cambiar de pagina.
    ; Para volver a la ruta en C puro: agregar -DNO_SIMD aqui y poner el stub en 0.
    -I stubs

monitor_speed = 115200
upload_speed = 921600

; RESTART_IN_VSYNC desactivado: con =y el DMA se reinicia en cada vsync, lo que
; causaba desplazamiento vertical + rayitas en el lado izquierdo de la pantalla.
; Con =n el DMA corre continuo y el swap de framebuffer es limpio.
custom_sdkconfig =
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    ; XiP desde PSRAM: mueve .text/.rodata a la PSRAM al arrancar, asi la CPU
    ; ejecuta desde PSRAM y NO depende del bus de Flash. En el S3, Flash y PSRAM
    ; comparten bus; cuando la CPU busca instrucciones en Flash bloquea el bus y
    ; el DMA del panel no alcanza a rellenar el bounce buffer -> pierde sincronia
    ; (imagen "arriba" + basura). Con XiP el bus de Flash deja de estorbar.
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    ; ── Ventana TCP: lo que limitaba el cambio de pagina ────────────────────────
    ; Bajar el JPEG de una pagina se llevaba 300-800 ms, y NO era el servidor (la
    ; misma imagen baja en 46 ms desde una PC de la misma red) ni el WiFi: era la
    ; ventana de recepcion. Un TCP no puede tener mas de una ventana "en vuelo",
    ; asi que el techo es ventana/RTT: con los 5760 B por defecto y el RTT del
    ; display al VPS (~30 ms, aire WiFi + internet) sale 192 KB/s, que es
    ; exactamente lo que se medio (~180 KB/s).
    ; Con 28720 B (20 x MSS de 1436, y por debajo de los 64 KB que es el maximo
    ; sin window scaling) el techo sube a ~950 KB/s, muy por encima de lo que da
    ; el WiFi del S3, asi que deja de ser el limitante.
    CONFIG_LWIP_TCP_WND_DEFAULT=28720
    ; La cola de recepcion del socket tiene que aguantar una ventana entera en
    ; segmentos: 28720 / 1436 = 20 -> 24 con margen. Si se queda corta, lwIP
    ; descarta segmentos ya recibidos y los pide otra vez (peor que no ampliar).
    CONFIG_LWIP_TCP_RECVMBOX_SIZE=24
    ; Y el driver WiFi tiene que poder entregar esa ventana: mas buffers de RX y
    ; ventana de block-ack mas grande. Cuesta ~12 KB fijos de RAM interna.
    CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=16
    CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=48
    CONFIG_ESP_WIFI_RX_BA_WIN=16

; Al recompilar el IDF (relink), arduino-esp32 arrastra componentes de features
; que NO usamos (y uno, esp-modbus, ni siquiera compila por un assert de sus
; timeouts). Los quitamos: build mas rapido y sin ese fallo.
custom_component_remove =
    espressif/esp-modbus
    chmorgan/esp-libhelix-mp3
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rcp_update
    espressif/esp_modem
    espressif/esp_secure_cert_mgr
    espressif/esp_schedule

; Dependencias (sin LVGL, sin Arduino_GFX: el panel se maneja con esp_lcd nativo)
lib_deps =
    bitbank2/JPEGDEC@^1.6.1
    adafruit/Adafruit BME280 Library@^2.2.0
    adafruit/Adafruit Unified Sensor@^1.1.0
    adafruit/Adafruit BusIO@^1.14.0
; El portal de configuracion (src/portal.h) usa WebServer + DNSServer, ambos del
; core de ESP32: ya no hace falta WiFiManager como dependencia externa.
